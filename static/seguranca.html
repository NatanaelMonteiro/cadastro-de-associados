<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="htmx-config" content='{"responseTargetSetsError":"true"}'>

    <title> FENEPE-DF - Segurança </title>

    <link rel="stylesheet" href="/static/assets/libraries/aos/aos.css">
    <link rel="stylesheet" href="/static/assets/css/main.css">
    <link rel="stylesheet" href="/static/assets/css/style.css">
    <link rel="stylesheet" href="/static/assets/css/sweet-alert.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/img/fenepe_icon.png">
    <link rel="canonical" href="index.html">
</head>

<body>
    <header class="position-absolute z-3 mt-3 px-5 w-100" data-bs-theme="dark">
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <a href="/static/index.html" class="navbar-brand img-rounded">
                    <img src="./assets/img/fenepe_icon.png" width="100" alt="logo">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText"
                    aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div id="navbarText"
                    class="container-fluid bg-blur py-3 mx-auto w-50 w-md-25 w-lg-100 navbar-collapse collapse">
                    <div class="col-4"></div>
                    <ul
                        class="navbar-nav align-items-center mx-auto w-50 w-md-25 w-lg-100 text-center gap-6 gap-lg-4 row-gap-3">
                        <li class="nav-item w-100">
                            <a href="index.html"
                                class="px-3 text-white bg-primary-hover nav-link rounded-3 text-base leading-6 fw-semibold"
                                aria-current="page">
                                Home
                            </a>
                        </li>
                        <li class="nav-item w-100">
                            <a href="seguranca.html"
                                class="px-3 text-white bg-primary-hover nav-link rounded-3 text-base leading-6 fw-semibold">
                                Segurança
                            </a>
                        </li>
                        <li class="nav-item w-100">
                            <a href="associados.html"
                                class="px-3 text-white bg-primary-hover nav-link rounded-3 text-base leading-6 fw-semibold">
                                Associados
                            </a>
                        </li>
                        <li class="nav-item w-100 ">
                            <div class="px-4 nav-link text-white bg-primary rounded-3 fw-semibold"
                                hx-get="/user/is_login" hx-trigger="load">
                                <!-- Exibir botão Login/Logout -->
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <div class="overflow-hidden py-6 position-relative rounded-bottom-3 rounded-md-4 m-0 m-sm-2 m-xl-3 shadow">
        <img src="./assets/img/armas.png" class="position-absolute z-n1 top-0 h-100 w-100 object-fit-cover"
            alt="Meeting">

        <div class="position-absolute z-n1 top-0 h-100 w-100 bg-dark"
            style="opacity: 0.85; mix-blend-mode: multiply; filter: contrast(1.15) brightness(0.85);">
        </div>

        <div class="position-absolute z-0 top-0 h-100 w-100">
            <div class="container h-100 d-flex align-items-center">
            </div>
        </div>
    </div>

    <div class="position-absolute z-1 h-50 top-0 mt-5 w-100">
        <div class="d-flex h-50 mt-5 align-items-end">
            <div class="col-lg-5 col-md-8 mx-auto mb-2 mt-5 text-center">
                <p class="mt-2 text-white text-lg">
                    Gestão de acessos e permissões de usuários do sistema
                </p>
            </div>
        </div>

        <div class="w-100 d-flex text-center">
            <div hx-ext="client-side-templates" class="col-lg-6 col-md-9 mx-auto text-start">
                <div id="admin-settings" class="w-100 py-5" hx-get="/admin/users" hx-trigger="load"
                    mustache-array-template="users-template">
                    <!-- A listagem vai ser exibida aqui. -->
                </div>

                <template id="users-template">
                    <table class="table table-striped table-dark">
                        <thead>
                            <tr>
                                <th>Email</th>
                                <th class="w-1">Permissões</th>
                                <th>&nbsp;</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- {{#data}} -->
                            <tr>
                                <td title="{{id}}" class="text-lowercase">{{username}}</td>
                                <td class="text-uppercase">{{permissions}}</td>
                                <td>
                                    <div class="d-flex flex-row flex-nowrap justify-content-end">
                                        <a id="admin" class="ps-3" hx-confirm="{{username}}"
                                            hx-patch="/admin/users/{{username}}/admin" hx-target="closest table"
                                            hx-swap="outerHTML swap:0.5s" data-bs-toggle="tooltip"
                                            data-bs-placement="right" title="Conceder poderes de Administrador">
                                            <i class="material-symbols-outlined">admin_panel_settings</i></a>

                                        <a id="remove" class="ps-3" hx-confirm="{{username}}"
                                            hx-patch="/admin/users/{{username}}/admin/remove" hx-target="closest table"
                                            hx-swap="outerHTML swap:0.5s" data-bs-toggle="tooltip"
                                            data-bs-placement="right" title="Remover permissão de Administrador">
                                            <i class="material-symbols-outlined">encrypted_minus_circle</i></a>

                                        <a id="delete" class="ps-3" hx-confirm="{{username}}"
                                            hx-delete="/admin/users/{{username}}" hx-target="closest tr"
                                            hx-swap="outerHTML swap:0.5s" data-bs-toggle="tooltip"
                                            data-bs-placement="right" title="Excluir usuário">
                                            <i class="material-symbols-outlined">delete</i></a>
                                    </div>
                                </td>

                            </tr>
                            <!-- {{/data}} -->

                            <!-- {{^data}} -->
                            <tr>
                                <td class="py-3 text-warning" colspan="8">Não há usuários cadastrados.</td>
                            </tr>
                            <!-- {{/data}} -->
                        </tbody>
                    </table>
                </template>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div id="toast-header" class="toast-header">
                <strong id="title-msg" class="me-auto text-white">Aviso</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body">
                <span id="toast-message"></span>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/htmx.org@1.9.10"
        integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC"
        crossorigin="anonymous"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/client-side-templates.js"></script>
    <script src="https://unpkg.com/mustache@latest"></script>
    <script src="./assets/libraries/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/libraries/aos/aos.js"></script>
    <script src="./assets/js/scripts.js"></script>
    <script src="./assets/js/color-modes.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/functions.js"></script>

</body>

</html>
