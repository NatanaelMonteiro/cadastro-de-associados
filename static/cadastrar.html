<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <title> FENEPE-DF - Cadastrar Participante </title>

    <link rel="stylesheet" href="/static/assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/assets/libraries/aos/aos.css">
    <link rel="stylesheet" href="/static/assets/css/main.css">
    <link rel="stylesheet" href="/static/assets/css/style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/img/fenepe_icon.png">
    <link rel="canonical" href="index.html">
</head>

<body data-bs-theme="dark">
    <header class="position-absolute z-3 mt-3 px-5 w-100" data-bs-theme="dark">
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <a href="/static/index.html" class="navbar-brand img-rounded">
                    <img src="./assets/img/fenepe_icon.png" width="100" alt="logo">
                </a>
                <div class="navbar-nav">
                    <a href="index.html" class="link btn bg-primary rounded-3 fw-semibold">Voltar</a>
                </div>
            </div>
        </nav>
    </header>

    <div class="overflow-hidden py-6 position-relative rounded-bottom-3 rounded-md-4 m-0 m-sm-2 m-xl-3 shadow">
        <img src="./assets/img/armas.png" class="position-absolute z-n1 top-0 h-100 w-100 object-fit-cover"
            alt="Meeting">

        <div class="position-absolute z-n1 top-0 h-100 w-100 bg-dark"
            style="opacity: 0.85; mix-blend-mode: multiply; filter: contrast(1.15) brightness(0.85);">
        </div>

        <div class="position-absolute z-0 top-0 h-100 w-100">
            <div class="container h-100 d-flex align-items-center">
            </div>
        </div>
    </div>

    <div class="container-fluid">

        <div hx-get="/user/is_logged" hx-trigger="load" hx-ext="client-side-templates"
            mustache-array-template="message"></div>

        <template id="message">
            <div class="position-relative mt-5 z-5 w-100">
                <div class="position-relative z-5 mt-5 col-lg-8 col-md-12 mx-auto text-center">
                    <p class="text-white text-lg" data-aos-delay="100" data-aos="fade" data-aos-duration="3000">
                        <!-- {{^data}} -->
                        Você ainda não está autenticado. Clique <a href="login.html">aqui</a> para se autenticar no
                        sistema.
                        <!-- {{/data}} -->
                    </p>
                </div>
            </div>
        </template>

        <div hx-get="/api/me" hx-trigger="load" hx-ext="client-side-templates" mustache-array-template="form-template">
            <!-- Dados do associado aqui -->
        </div>

        <template id="form-template">
            <div class="position-relative z-5 col-lg-8 col-md-12 mx-auto text-center">
                <div class="text-white text-lg">
                    <!-- {{#data}} -->
                    Verificamos que você já tem um cadastro conosco. Clique <a href="/static/editar.html">aqui</a> para consultar os dados do seu cadastro e, se necessário, atualizar as informações.
                    <!-- {{/data}} -->

                    <!-- {{^data}} -->
                    Precisamos de mais alguns dados para completar o seu cadastro. Por favor, preencha o formulário a
                    seguir com as informações solicitadas.
                    <!-- {{/data}} -->
                </div>
            </div>

            <form id="form" class="w-100">
                <!-- {{^data}} -->
                <div class="d-flex flex-row w-100 mb-5 gap-5 flex-wrap justify-content-center">
                    <div class="d-flex flex-column col-12 col-md-8 col-lg-4">
                        <fieldset>
                            <div>
                                <label for="nome" class="form-label mt-5">Nome completo</label>
                                <input type="text" class="form-control" id="nome" name="nome"
                                    aria-describedby="nomeHelp" placeholder="Insira seu nome aqui">
                            </div>
                            <div>
                                <label for="nome_guerra" class="form-label mt-4">Nome de guerra</label>
                                <input type="text" class="form-control" id="nome_guerra" name="nome_guerra"
                                    aria-describedby="guerraHelp" placeholder="Insira seu nome de guerra aqui">
                            </div>

                            <div>
                                <label for="patente" class="form-label mt-4">Graduação</label>
                                <select class="form-select text-muted" id="patente" name="patente">
                                    <option selected disabled value="">Selecione a graduação</option>
                                    <option>Soldado</option>
                                    <option>Cabo</option>
                                    <option>Sargento</option>
                                    <option>Subtenente</option>
                                    <option>Subtenente</option>
                                    <option>2° Tenente</option>
                                    <option>1° Tenente</option>
                                    <option>Capitão</option>
                                    <option>Major</option>
                                    <option>Tenente coronel</option>
                                    <option>Coronel</option>
                                </select>
                            </div>

                            <div>
                                <label for="cpf" class="form-label mt-4">CPF</label>
                                <input type="int" class="form-control" id="cpf" name="cpf" aria-describedby="cpfHelp"
                                    placeholder="Insira seu cpf aqui">
                            </div>
                            <div>
                                <label for="rg" class="form-label mt-4">RG</label>
                                <input type="text" class="form-control" id="rg" name="rg" aria-describedby="rgHelp"
                                    placeholder="Insira seu rg aqui">
                            </div>
                            <div>
                                <label for="dt_nasc" class="form-label mt-4">Data de nascimento</label>
                                <input type="date" class="form-control text-muted" id="dt_nasc" name="dt_nasc"
                                    aria-describedby="nascHelp" placeholder="Insira sua data de nascimento aqui">
                            </div>
                            <div>
                                <label for="lotacao" class="form-label mt-4">Lotação</label>
                                <input type="text" class="form-control" id="lotacao" name="lotacao"
                                    aria-describedby="lotacaoHelp" placeholder="Insira sua lotação aqui">
                            </div>
                            <div>
                                <label for="matricula" class="form-label mt-4">Matrícula</label>
                                <input type="text" class="form-control" id="matricula" name="matricula"
                                    aria-describedby="matriculaHelp" placeholder="Insira sua matrícula aqui">
                            </div>
                        </fieldset>
                    </div>

                    <div class="d-flex flex-column col-12 col-md-8 col-lg-4">
                        <fieldset>
                            <div>
                                <label for="cfsd" class="form-label mt-5">CFP/CFSD</label>
                                <input type="text" class="form-control" id="cfsd" name="cfp_cfsd"
                                    aria-describedby="cfsdaHelp" placeholder="Insira aqui">
                            </div>
                            <div>
                                <label for="telefone" class="form-label mt-4">Telefone</label>
                                <input type="int" class="form-control" id="telefone" name="telefone"
                                    aria-describedby="telHelp" placeholder="Insira seu número aqui">
                            </div>

                            <div hx-get="/api/user_name" hx-trigger="load" hx-target="#email"></div>

                            <div class="d-flex flex-column pe-1">
                                <label class="form-label mt-4">Email</label>
                                <div class="border rounded">
                                    <div id="email" class="fake-input text-muted" data-bs-toggle="tooltip" data-bs-placement="left"
                                        title="Não pode ser alterado!"></div>
                                </div>
                            </div>
                        </fieldset>

                        <fieldset>
                            <label class="mt-3">Selecione o gênero</label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" id="masculino" name="genero"
                                    value="masculino">
                                <label class="form-check-label" for="masculino">
                                    Masculino
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" id="feminino" name="genero"
                                    value="feminino">
                                <label class="form-check-label" for="feminino">
                                    Feminino
                                </label>
                            </div>
                        </fieldset>

                        <fieldset>
                            <label class="mt-3">PM ou BM</label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="pm_bm" id="pm" value="pm">
                                <label class="form-check-label" for="pm">
                                    PM
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="pm_bm" id="bm" value="bm">
                                <label class="form-check-label" for="bm">
                                    BM
                                </label>
                            </div>
                        </fieldset>

                        <fieldset>
                            <label class="mt-3">Dependentes</label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="dependentes" id="dep_sim" value="on">
                                <label class="form-check-label" for="dep_sim">
                                    Sim
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="dependentes" id="dep_nao"
                                    value="off">
                                <label class="form-check-label" for="dep_nao">
                                    Não
                                </label>
                            </div>
                        </fieldset>

                        <fieldset>
                            <label class="mt-3">Situação</label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" id="ativo" name="situacao" value="ativo">
                                <label class="form-check-label" for="ativo">
                                    Ativo
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" id="inativo" name="situacao"
                                    value="inativo">
                                <label class="form-check-label" for="inativo">
                                    Inativo
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" id="perseguicao" name="situacao"
                                    value="perseguicao">
                                <label class="form-check-label" for="perseguicao">
                                    Expulso por perseguição
                                </label>
                            </div>
                        </fieldset>

                        <fieldset>
                            <div class="d-flex flex-row py-4 form-check form-switch justify-content-start">
                                <label>
                                    <input class="form-check-input" type="checkbox" id="confimacao"
                                        onclick="agree(event)">
                                    Confirmo estar ciente e de acordo com o estatuto da FENEPE, e da minha
                                    adesão a FENEPE-DF.
                                </label>
                            </div>
                        </fieldset>

                        <div class="d-flex flex-row justify-content-end px-4">
                            <fieldset>
                                <button id="btn-salvar" class="btn text-white bg-primary disabled" type="button"
                                    hx-post="/api/members" hx-target="#toast-message" hx-include="#form">Salvar</button>
                            </fieldset>
                        </div>
                    </div>
                </div>
                <!-- {{/data}} -->
            </form>
        </template>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div id="toast-header" class="toast-header">
                <strong id="title-msg" class="me-auto text-white">Aviso</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body">
                <span id="toast-message"></span>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/htmx.org@1.9.10"
        integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC"
        crossorigin="anonymous"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/client-side-templates.js"></script>
    <script src="https://unpkg.com/mustache@latest"></script>
    <script src="./assets/libraries/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/libraries/aos/aos.js"></script>
    <script src="./assets/js/scripts.js"></script>
    <script src="./assets/js/color-modes.js"></script>
    <script src="./assets/js/functions.js"></script>

</body>

</html>
