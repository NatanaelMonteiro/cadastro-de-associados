<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/assets/libraries/aos/aos.css">
    <link rel="stylesheet" href="/static/assets/css/main.css">
    <link rel="stylesheet" href="/static/assets/css/style.css">

    <title> FENEPE-DF - Administração </title>

    <link rel="icon" type="image/png" sizes="32x32" href="./assets/img/fenepe_icon.png">
    <link rel="canonical" href="index.html">
</head>

<body>

    <header class="position-absolute z-3 mt-3 w-100" data-bs-theme="dark">
        <nav class="navbar navbar-expand-xl" aria-label="Offcanvas navbar large">
            <div class="container py-1">
                <a href="./index.html" class="navbar-brand img-rounded">
                    <img src="./assets/img/fenepe_icon.png" height="120" alt="logo">
                </a>
                <div class="offcanvas offcanvas-end border-0 rounded-start-0 rounded-start-sm-4" tabindex="-1"
                    id="offcanvasNavbar2" aria-labelledby="offcanvasNavbar2Label">
                    <div class="offcanvas-header">
                        <h5 class="offcanvas-title m-0" id="offcanvasNavbar2Label">
                            <a class="navbar-brand" href="index.html">
                                <img src="./assets/img/fenepe_icon.png" height="64" alt="logo">
                            </a>
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                    </div>

                    <div class="offcanvas-body">
                        <ul class="navbar-nav align-items-xl-center flex-grow-1 column-gap-5 row-gap-3 row-gap-xl-3">
                            <li class="nav-item ms-xl-auto">
                                <a href="index.html"
                                    class="px-3 text-white bg-primary-hover nav-link rounded-3 text-base leading-6 fw-semibold"
                                    aria-current="page">
                                    Home
                                </a>
                            </li>

                            <li class="nav-item">
                                <a href="index.html#about"
                                    class="px-3 text-white bg-primary-hover nav-link rounded-3 text-base leading-6 fw-semibold">
                                    Fenepe
                                </a>
                            </li>

                            <li class="nav-item">
                                <a href="index.html#footer"
                                    class="px-3 text-white bg-primary-hover nav-link rounded-3 text-base leading-6 fw-semibold">
                                    Contato
                                </a>
                            </li>

                            <li id="login" class="nav-item ms-xl-auto">
                                <a href="/user/logout"
                                    class="logout px-3 bg-primary nav-link rounded-3 text-base leading-6 fw-semibold text-center">
                                    Sair
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
    </header>





    <div class="py-8 position-relative h-100 top-0 rounded-bottom-3 rounded-sm-4 rounded-xl-5 m-0 m-sm-2 m-xl-3 shadow">
        <img src="./assets/img/armas.png" class="position-absolute z-n1 top-0 h-100 w-100 object-fit-cover"
            alt="Meeting">
        <div class="position-absolute z-n1 top-0 h-100 w-100 bg-dark"
            style="opacity: 0.85; mix-blend-mode: multiply; filter: contrast(1.15) brightness(0.85);">
        </div>

        <div class="position-absolute z-1 h-100 top-0 mt-3 w-100">
            <div class="d-flex h-100 align-items-end">
                <div class="col-lg-5 col-md-8 mx-auto mb-5 text-start">
                    <p class="mt-5 text-white text-lg" data-aos-delay="100" data-aos="fade" data-aos-duration="3000">
                        Área de acesso restrito aos administradores do Sistema.
                    </p>
                </div>
            </div>

            <div class="w-100 d-flex text-center">

                <div hx-ext="client-side-templates" class="col-lg-5 col-md-8 mx-auto text-start">


                    <div id="slot-lista" class="w-100 py-5" hx-get="/admin/users" hx-trigger="load"
                        mustache-array-template="users-template">
                        <!-- A listagem vai ser exibida aqui. -->
                    </div>

                    <template id="users-template">
                        <h4 class="pb-3">Usuários cadastrados no sistema:</h4>
                        <table class="table table-striped table-dark">
                            <thead>
                                <tr>
                                    <th>Email</th>
                                    <th class="w-1">Permissões</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- {{#data}} -->
                                <tr>
                                    <td title="{{id}}" class="text-lowercase">{{username}}</td>
                                    <td class="text-uppercase">{{permissions}}</td>
                                </tr>
                                <!-- {{/data}} -->

                                <!-- {{^data}} -->
                                <tr>
                                    <td class="py-3 text-warning" colspan="8">Não há usuários cadastrados.</td>
                                </tr>
                                <!-- {{/data}} -->
                            </tbody>
                        </table>
                    </template>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div id="toast-header" class="toast-header">
                <strong id="title-msg" class="me-auto">Aviso</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body">
                <span id="toast-message"></span>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/htmx.org@1.9.10"
        integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC"
        crossorigin="anonymous"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/client-side-templates.js"></script>
    <script src="https://unpkg.com/mustache@latest"></script>
    <script src="./assets/libraries/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/libraries/aos/aos.js"></script>
    <script src="./assets/js/scripts.js"></script>
    <script src="./assets/js/color-modes.js"></script>
    <script src="./assets/js/functions.js"></script>

</body>

</html>
