<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/bootstrap.min.css">
    <link rel="stylesheet" href="./styles/scroll.css">
    <link rel="icon" type="image/x-icon" href="./img/fenepe_icon.png">
    <title>FENEPE-CADASTRO</title>
</head>

<header>
    <legend class="text-center">Cadastre-se</legend>
    <div class="menu">
        <nav>
            <a href="scroll.html">HOME</a>
            <a href="#">FENEPE</a>
            <a href="form.html">CADASTRO</a>
            <a href="#">CONTATOS</a>
        </nav>
    </div>
</header>

<body>
    <div class="container">
        <div class="w-100">

            <!-- <img src="./img/fenepe_icon.png"> -->
        </div>

        <form class="w-100">
            <div class="d-flex flex-row w-100 justify-content-center">
                <div class="d-flex flex-column col-lg-4 m-3 pt-5">
                    <fieldset>
                        <div>
                            <label for="nome" class="form-label mt-5">Nome completo</label>
                            <input type="text" class="form-control" id="nome" aria-describedby="nomeHelp"
                                placeholder="Insira seu nome aqui">
                        </div>
                        <div>
                            <label for="guerra" class="form-label mt-4">Nome de guerra</label>
                            <input type="text" class="form-control" id="guerra" aria-describedby="guerraHelp"
                                placeholder="Insira seu nome de guerra aqui">
                        </div>
                        <div>
                            <label for="graduacao" class="form-label mt-4">Selecione a graduação</label>
                            <select class="form-select" id="exampleSelect1">
                                <option>...</option>
                                <option>Soldado</option>
                                <option>Cabo</option>
                                <option>Sargento</option>
                                <option>Subtenente</option>
                                <option>Subtenente</option>
                                <option>2° Tenente</option>
                                <option>1° Tenente</option>
                                <option>Capitão</option>
                                <option>Major</option>
                                <option>Tenente coronel</option>
                                <option>Coronel</option>
                            </select>
                        </div>
                        <div>
                            <label for="cpf" class="form-label mt-4">CPF</label>
                            <input type="int" class="form-control" id="cpf" aria-describedby="cpfHelp"
                                placeholder="Insira seu cpf aqui">
                        </div>
                        <div>
                            <label for="rg" class="form-label mt-4">RG</label>
                            <input type="text" class="form-control" id="rg" aria-describedby="rgHelp"
                                placeholder="Insira seu rg aqui">
                        </div>
                        <div>
                            <label for="nasc" class="form-label mt-4">Data de nascimento</label>
                            <input type="date" class="form-control" id="nasc" aria-describedby="nascHelp"
                                placeholder="Insira sua data de nascimento aqui">
                        </div>
                        <div>
                            <label for="lotacao" class="form-label mt-4">Lotação</label>
                            <input type="text" class="form-control" id="lotacao" aria-describedby="lotacaoHelp"
                                placeholder="Insira sua lotação aqui">
                        </div>
                        <div>
                            <label for="matricula" class="form-label mt-4">Matrícula</label>
                            <input type="text" class="form-control" id="matricula" aria-describedby="matriculaHelp"
                                placeholder="Insira sua matrícula aqui">
                        </div>
                    </fieldset>
                </div>


                <div class="d-flex flex-column col-lg-4 m-3 pt-5">
                    <fieldset>

                        <div>
                            <label for="cfsd" class="form-label mt-5">CFP/CFSD</label>
                            <input type="text" class="form-control" id="cfsd" aria-describedby="cfsdaHelp"
                                placeholder="Insira aqui">
                        </div>
                        <div>
                            <label for="tel" class="form-label mt-4">Telefone</label>
                            <input type="int" class="form-control" id="tel" aria-describedby="telHelp"
                                placeholder="Insira seu número aqui">
                        </div>
                        <div>
                            <label for="email" class="form-label mt-4">Email</label>
                            <input type="email" class="form-control" id="email" aria-describedby="emailHelp"
                                placeholder="Insira seu email aqui">
                        </div>
                    </fieldset>

                    <fieldset>
                        <label class="mt-3">Selecione o gênero</label>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="optionsRadios" id="optionsRadios1"
                                value="option1">
                            <label class="form-check-label" for="optionsRadios1">
                                Masculino
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="optionsRadios" id="optionsRadios2"
                                value="option2">
                            <label class="form-check-label" for="optionsRadios2">
                                Feminino
                            </label>
                        </div>
                    </fieldset>

                    <fieldset>
                        <label class="mt-3">PM ou BM</label>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="optionsRadios" id="optionsRadios1"
                                value="option1">
                            <label class="form-check-label" for="optionsRadios1">
                                PM
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="optionsRadios" id="optionsRadios2"
                                value="option2">
                            <label class="form-check-label" for="optionsRadios2">
                                BM
                            </label>
                        </div>
                    </fieldset>

                    <fieldset>
                        <label class="mt-3">Dependentes</label>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="flexSwitchCheckDefault">
                            <label class="form-check-label" for="flexSwitchCheckDefault">Sim</label>
                        </div>
                    </fieldset>

                    <fieldset>
                        <label class="mt-3">Situação</label>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="optionsRadios" id="optionsRadios1"
                                value="option1">
                            <label class="form-check-label" for="optionsRadios1">
                                Ativo
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="optionsRadios" id="optionsRadios2"
                                value="option2">
                            <label class="form-check-label" for="optionsRadios2">
                                Inativo
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="optionsRadios" id="optionsRadios3"
                                value="option3">
                            <label class="form-check-label" for="optionsRadios3">
                                Expulso por perseguição
                            </label>
                        </div>
                    </fieldset>

                    <fieldset>
                        <label class="mt-3">Confirmo estar ciente e de acordo com o estatuto da FENEPE, e da minha
                            adesão a FENEPE-DF</label>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="flexSwitchCheckDefault">
                            <label class="form-check-label" for="flexSwitchCheckDefault"></label>
                        </div>
                    </fieldset>
                </div>
            </div>
        </form>
    </div>
</body>

</html>
